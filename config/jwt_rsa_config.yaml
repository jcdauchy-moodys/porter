# Porter Server Configuration with JWT RSA256 Authentication
#
# This configuration file demonstrates how to set up JWT authentication
# using RSA256 signing algorithm with public key verification.

# Server configuration
address: "0.0.0.0:8815"
backend: "duckdb"  # or "oracle", "clickhouse"
database: ":memory:"
log_level: "info"
max_connections: 100
connection_timeout: 30s
query_timeout: 5m
max_message_size: 16777216  # 16MB
shutdown_timeout: 30s

# TLS configuration (recommended for production)
tls:
  enabled: false
  cert_file: "/path/to/server.crt"
  key_file: "/path/to/server.key"
  # Optional: Mutual TLS
  client_auth: false
  client_ca_cert_file: "/path/to/client-ca.crt"

# JWT Authentication with RSA256
auth:
  enabled: true
  type: jwt
  jwt_auth:
    # For RSA256 verification, provide the public key file
    # This is used to verify tokens signed by the corresponding private key
    public_key_file: "/etc/porter/keys/rsa_public.pem"
    
    # Optional: If Porter also needs to issue tokens (not common for backend services)
    # private_key_file: "/etc/porter/keys/rsa_private.pem"
    
    # Issuer claim validation - must match the 'iss' claim in the JWT
    issuer: "your-auth-server"
    
    # Audience claim validation - must match the 'aud' claim in the JWT
    audience: "porter-api"

# Metrics configuration
metrics:
  enabled: true
  address: ":9090"
  path: "/metrics"

# Health check configuration
health:
  enabled: true
  interval: 10s
  # For Oracle: query: "SELECT 1 FROM DUAL"
  # For DuckDB: query: "SELECT 1"

# Enable gRPC reflection for development
reflection: true

# Connection pool settings
connection_pool:
  max_open_connections: 25
  max_idle_connections: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m
  health_check_period: 1m

# Transaction settings
transaction:
  default_isolation_level: "READ_COMMITTED"
  max_transaction_age: 1h
  cleanup_interval: 5m

# Cache configuration
cache:
  enabled: true
  max_size: 104857600  # 100MB
  ttl: 5m
  cleanup_interval: 1m
  enable_stats: true
  prepared_statements:
    enabled: true
    max_size: 10485760  # 10MB
    ttl: 1h
  query_results:
    enabled: true
    max_size: 52428800  # 50MB
    ttl: 5m

# Performance options
safe_copy: false

